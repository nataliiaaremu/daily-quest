name: CI

# Runs on every pull request and on main. Netlify deploys the site itself
# when main changes; this workflow only checks that the change is safe.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (production dependencies)
        run: pnpm run audit:ci

      - name: Unit tests
        run: pnpm run test:ci

      - name: Production build and prerender
        run: pnpm run build:ci
